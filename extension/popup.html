<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        font-family: system-ui, sans-serif;
        padding: 12px;
        color: #111;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #555;
        margin-top: 8px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font-size: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-top: 2px;
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        background: #111;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
      }
      .ok {
        color: #16a34a;
      }
      .erro {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <h1>Legaus Kids — Atendimento</h1>
    <label for="apiUrl">URL do sistema</label>
    <input id="apiUrl" placeholder="https://crm.legauskids.com.br" />
    <label for="apiToken">Token de acesso</label>
    <input id="apiToken" placeholder="cole o token da tela /extensao" />
    <button id="salvar">Salvar e testar conexão</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
